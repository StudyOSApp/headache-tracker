<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>Headache Tracker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/styles.css" />
    <script type="module" src="assets/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <span class="mark" aria-hidden="true">◒</span
        ><span
          >Headache Tracker<small
            >A little clarity, one entry at a time.</small
          ></span
        ><span class="prototype">Prototype</span>
      </header>
      <p id="notice" role="status" hidden></p>
      <main id="main" tabindex="-1"></main>
      <footer>
        Stored only in this browser. Use made-up entries for testing.
      </footer>
      <nav aria-label="Primary navigation">
        <button data-page="home">Home</button
        ><button data-page="history">History</button
        ><button data-page="reports">Reports</button
        ><button data-page="settings">Settings</button>
      </nav>
    </div>
    <dialog id="confirmation" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-copy"></p>
      <div class="actions">
        <button id="confirm-cancel" autofocus>Cancel</button
        ><button id="confirm-delete" class="danger">Delete</button>
      </div>
    </dialog>
    <noscript>Enable JavaScript to use this local prototype.</noscript>
  </body>
</html>
